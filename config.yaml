name: "ChoreQuest"
version: "2.1.0"
slug: "chorequest"
description: "Gamified family chore & routine management for Home Assistant with ADHD weighted dice picker, custom chore categories, unified leaderboard & stats reports, giant spontaneous task cards, 700+ emoji database, and audit-logged task deletion."
url: "https://github.com/filidam89/chore-quest-addon"
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 9006
panel_title: "ChoreQuest"
panel_icon: "mdi:trophy-award"
panel_admin: false
ports:
  9006/tcp: 9006
ports_description:
  9006/tcp: "ChoreQuest Web App UI"
webui: "http://[HOST]:[PORT:9006]/"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options: {}
schema: {}
